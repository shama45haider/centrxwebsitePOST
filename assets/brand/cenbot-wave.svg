<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 14 334 470" role="img" aria-labelledby="cbT"><title id="cbT">Cenbot</title>
<style>
  /* A short wave every few seconds, from the elbow. Still for anyone who asks for less motion. */
  .wave { transform-box: view-box; transform-origin: 78px 304px; animation: cbwave 4.2s ease-in-out .5s infinite; }
  @keyframes cbwave { 0%, 46%, 100% { transform: rotate(0deg); } 9% { transform: rotate(16deg); } 18% { transform: rotate(-5deg); } 28% { transform: rotate(14deg); } 37% { transform: rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
</style>
<defs>
  <linearGradient id="cbShell" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F1F5FB"/><stop offset="1" stop-color="#D9E3F1"/></linearGradient>
  <linearGradient id="cbBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="1" stop-color="#0A5CFF"/></linearGradient>
  <linearGradient id="cbBlueDeep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F78FF"/><stop offset="1" stop-color="#0646C8"/></linearGradient>
  <linearGradient id="cbVisor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2D5C"/><stop offset="0.55" stop-color="#0C1631"/><stop offset="1" stop-color="#060B1C"/></linearGradient>
  <linearGradient id="cbGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <radialGradient id="cbShade" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0B1B3A" stop-opacity="0.22"/><stop offset="1" stop-color="#0B1B3A" stop-opacity="0"/></radialGradient>
</defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="468" rx="118" ry="14" fill="url(#cbShade)"/>
  <!-- legs -->
  <rect x="157" y="350" width="40" height="80" rx="18" fill="url(#cbShell)"/>
  <rect x="203" y="350" width="40" height="80" rx="18" fill="url(#cbShell)"/>
  <circle cx="177" cy="392" r="15" fill="url(#cbBlue)"/>
  <circle cx="223" cy="392" r="15" fill="url(#cbBlue)"/>
  <!-- feet -->
  <path d="M146 438 C146 424 156 418 172 418 L186 418 C198 418 200 426 200 438 L200 452 L146 452 Z" fill="url(#cbShell)"/>
  <path d="M200 438 C200 426 202 418 214 418 L228 418 C244 418 254 424 254 438 L254 452 L200 452 Z" fill="url(#cbShell)"/>
  <rect x="142" y="448" width="58" height="10" rx="5" fill="url(#cbBlueDeep)"/>
  <rect x="200" y="448" width="58" height="10" rx="5" fill="url(#cbBlueDeep)"/>
  <!-- right arm (hanging) -->
  <path d="M272 262 L288 326" stroke="#D3DDEC" stroke-width="32" stroke-linecap="round"/>
  <path d="M272 262 L288 326" stroke="url(#cbShell)" stroke-width="28" stroke-linecap="round"/>
  <path d="M272 262 L281 296" stroke="url(#cbBlue)" stroke-width="28" stroke-linecap="butt" opacity="0"/>
  <circle cx="282" cy="298" r="13" fill="url(#cbBlue)"/>
  <circle cx="290" cy="340" r="19" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="2"/>
  <rect x="274" y="318" width="32" height="10" rx="5" fill="url(#cbBlueDeep)" transform="rotate(-15 290 323)"/>
  <path d="M280 346 Q290 352 300 346" fill="none" stroke="#13234A" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <!-- left arm (waving): the upper arm stays; the forearm and hand swing from the elbow (78,304).
       Outline and fill are separate groups so the elbow joint has no seam; both run the same animation. -->
  <path d="M130 262 L78 304" fill="none" stroke="#D3DDEC" stroke-width="32" stroke-linecap="round"/>
  <g class="wave"><path d="M78 304 L46 236" fill="none" stroke="#D3DDEC" stroke-width="32" stroke-linecap="round"/></g>
  <path d="M130 262 L78 304" fill="none" stroke="url(#cbShell)" stroke-width="28" stroke-linecap="round"/>
  <g class="wave">
  <path d="M78 304 L46 236" fill="none" stroke="url(#cbShell)" stroke-width="28" stroke-linecap="round"/>
  <rect x="31" y="222" width="30" height="12" rx="6" fill="url(#cbBlueDeep)" transform="rotate(-25 46 228)"/>
  <!-- hand -->
  <g transform="translate(-36 0) rotate(-8 80 200)">
    <rect x="58" y="160" width="11" height="34" rx="5.5" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="1.5"/>
    <rect x="71" y="150" width="11" height="42" rx="5.5" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="1.5"/>
    <rect x="84" y="152" width="11" height="40" rx="5.5" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="1.5"/>
    <rect x="97" y="164" width="11" height="32" rx="5.5" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="1.5"/>
    <g stroke="#13234A" stroke-width="2.5" stroke-linecap="round" opacity="0.6"><path d="M60 176 L67 176"/><path d="M73 168 L80 168"/><path d="M86 169 L93 169"/><path d="M99 178 L106 178"/></g>
    <rect x="104" y="190" width="11" height="26" rx="5.5" transform="rotate(38 109 203)" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="1.5"/>
    <rect x="58" y="184" width="50" height="40" rx="18" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="1.5"/>
    <circle cx="83" cy="204" r="11" fill="url(#cbBlue)"/>
  </g>
  </g>
  <circle cx="78" cy="304" r="13" fill="url(#cbBlue)"/>
  <!-- torso -->
  <path d="M146 250 C146 236 158 228 174 228 L226 228 C242 228 254 236 254 250 L250 318 C248 344 230 360 200 360 C170 360 152 344 150 318 Z" fill="url(#cbShell)" stroke="#D3DDEC" stroke-width="2"/>
  <path d="M152 326 C170 340 230 340 248 326 C244 346 226 360 200 360 C174 360 156 346 152 326 Z" fill="url(#cbBlueDeep)"/>
  <circle cx="132" cy="258" r="17" fill="url(#cbBlue)"/>
  <circle cx="270" cy="258" r="17" fill="url(#cbBlue)"/>
  <!-- collar + neck -->
  <rect x="180" y="214" width="40" height="22" rx="6" fill="#13234A"/>
  <rect x="164" y="226" width="72" height="16" rx="8" fill="url(#cbBlue)"/>
  <!-- chest mark + name -->
  <g transform="translate(182 256) scale(0.36)"><path fill="#0A5CFF" d="M14.71 14.66L37.48 27.55A11.98 11.98 0 0 1 43.56 37.98L43.56 43.08A11.59 11.59 0 0 1 26.66 53.38L10.54 45.08A9.37 9.37 0 0 1 5.46 36.75L5.46 20.05A6.19 6.19 0 0 1 14.71 14.66ZM11.58 69.84L34.2 59.6A7.37 7.37 0 0 1 44.61 66.31L44.61 77.25A12.34 12.34 0 0 1 37.66 88.35L15.16 99.28A6.46 6.46 0 0 1 5.88 93.47L5.88 78.68A9.7 9.7 0 0 1 11.58 69.84ZM60.07 12.14L83.56 0.7A6.85 6.85 0 0 1 93.41 6.87L93.41 24.23A10.38 10.38 0 0 1 87.55 33.58L63.42 45.23A7.61 7.61 0 0 1 52.51 38.38L52.51 24.23A13.45 13.45 0 0 1 60.07 12.14ZM75.16 51.73L89.43 59.69A9.95 9.95 0 0 1 94.54 68.39L94.54 86.23A6.15 6.15 0 0 1 85.44 91.62L60.86 78.18A11.99 11.99 0 0 1 54.62 67.65L54.62 63.79A13.81 13.81 0 0 1 75.16 51.73Z"/></g>
  <text x="200" y="314" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#13234A" letter-spacing="0.2">Cenbot</text>

<g class="cb-head-g">
  <!-- ear pods -->
  <rect x="80" y="92" width="34" height="78" rx="17" fill="url(#cbBlueDeep)"/>
  <rect x="286" y="92" width="34" height="78" rx="17" fill="url(#cbBlueDeep)"/>
  <rect x="88" y="104" width="10" height="54" rx="5" fill="#FFFFFF" opacity="0.28"/>
  <!-- helmet -->
  <rect x="96" y="34" width="208" height="190" rx="92" fill="url(#cbShell)"/>
  <path d="M120 70 C150 42 250 42 280 70" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <!-- top cap -->
  <path d="M168 40 C168 30 175 26 186 26 L214 26 C225 26 232 30 232 40 L232 46 C222 50 178 50 168 46 Z" fill="url(#cbBlue)"/>
  <!-- visor -->
  <rect x="116" y="74" width="168" height="124" rx="54" fill="#C9D6EA"/>
  <rect x="120" y="78" width="160" height="116" rx="50" fill="url(#cbVisor)"/>
  <path d="M146 86 L254 86 C268 86 274 92 272 100 C240 94 164 94 128 104 C128 94 134 86 146 86 Z" fill="url(#cbGloss)"/>
  <!-- face -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 140 Q166 120 182 140" stroke="#4FA0FF" stroke-width="16" opacity="0.18"/>
    <path d="M218 140 Q234 120 250 140" stroke="#4FA0FF" stroke-width="16" opacity="0.18"/>
    <path d="M150 140 Q166 120 182 140" stroke="#4FA0FF" stroke-width="8"/>
    <path d="M218 140 Q234 120 250 140" stroke="#4FA0FF" stroke-width="8"/>
    <path d="M186 162 Q200 174 214 162" stroke="#4FA0FF" stroke-width="7"/>
  </g>
</g>
</svg>
